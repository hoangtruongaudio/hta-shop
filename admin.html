<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Shop Seller Center - Quản lý sản phẩm & Đánh giá riêng</title>
<!-- Firebase Web SDK v9 -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<style>
:root {
  --primary: #fe2c55;
  --bg-dark: #121212;
  --bg-sidebar: #1e1e1e;
  --bg-card: #282828;
  --bg-input: #333333;
  --text-main: #ffffff;
  --text-muted: #aaaaaa;
  --border: #383838;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

#loginModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.login-card { background: var(--bg-card); padding: 30px; border-radius: 12px; width: 360px; border: 1px solid var(--border); text-align: center; }
.login-card h2 { color: var(--primary); margin-bottom: 20px; font-size: 22px; }
.login-card input { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: #fff; outline: none; }
.login-card button { width: 100%; padding: 12px; background: var(--primary); border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; }

.sidebar { width: 240px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.brand { padding: 20px; font-size: 18px; font-weight: bold; color: var(--primary); border-bottom: 1px solid var(--border); }
.menu { list-style: none; padding: 15px 0; }
.menu-item { padding: 12px 20px; color: var(--text-muted); cursor: pointer; font-size: 14px; }
.menu-item.active { background: #2a2a2a; color: var(--primary); border-left: 4px solid var(--primary); }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.header { height: 60px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; }
.content { flex: 1; padding: 25px; overflow-y: auto; }

.table-container { background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
.table-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.search-box { background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: #fff; outline: none; width: 250px; }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
th, td { padding: 12px 18px; border-bottom: 1px solid var(--border); }
th { background: #222; color: var(--text-muted); font-weight: 600; }
tr:hover { background: #2f2f2f; }

.btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-secondary { background: #444; color: #fff; }
.btn-sm { padding: 4px 8px; font-size: 12px; }

.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: var(--text-muted); }
.form-control { width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: #fff; outline: none; }

.media-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 8px; }
.media-box { aspect-ratio: 1; background: var(--bg-input); border: 2px dashed var(--border); border-radius: 6px; position: relative; }
.media-box img { width: 100%; height: 100%; object-fit: cover; }
.media-box .remove-btn { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; cursor: pointer; font-size: 10px; }

/* Khu vực quản lý đánh giá trong Modal sản phẩm */
.review-item-admin { background: #222; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
</style>
</head>
<body>

<div id="loginModal">
  <div class="login-card">
    <h2>TikTok Shop Seller</h2>
    <input type="password" id="loginPass" placeholder="Nhập mật khẩu (123456)">
    <button onclick="checkLogin()">ĐĂNG NHẬP</button>
  </div>
</div>

<div class="sidebar">
  <div class="brand">🎵 Seller Center</div>
  <ul class="menu">
    <li class="menu-item active">🛍️ Quản lý sản phẩm & Đánh giá</li>
  </ul>
</div>

<div class="main">
  <div class="header">
    <div style="font-weight: bold;">Quản lý Sản phẩm kèm Đánh giá riêng</div>
  </div>

  <div class="content">
    <div class="table-container">
      <div class="table-header">
        <input type="text" id="searchProductInput" class="search-box" oninput="renderProducts()" placeholder="Tìm kiếm sản phẩm...">
        <button class="btn btn-primary" onclick="openProductModal()">+ Thêm sản phẩm mới</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Hình ảnh</th>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số bán / Đánh giá</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="productTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Thêm/Sửa Sản Phẩm & Đánh Giá Riêng -->
<div id="productModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:1000;">
  <div style="background:var(--bg-card); width:850px; max-height:90vh; overflow-y:auto; border-radius:12px; padding:25px; border:1px solid var(--border);">
    <h3 id="modalProductTitle" style="margin-bottom:15px; color:var(--primary);">Cấu hình sản phẩm</h3>
    
    <input type="hidden" id="prodEditId">
    
    <div class="form-group">
      <label>Tên sản phẩm *</label>
      <input type="text" id="prodName" class="form-control" placeholder="Tên sản phẩm">
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
      <div class="form-group">
        <label>Giá bán (₫) *</label>
        <input type="text" id="prodPrice" class="form-control" placeholder="189.000₫">
      </div>
      <div class="form-group">
        <label>Giá gốc (₫)</label>
        <input type="text" id="prodOldPrice" class="form-control" placeholder="299.000₫">
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
      <div class="form-group">
        <label>Đã bán hiển thị (VD: 127.5K)</label>
        <input type="text" id="prodSold" class="form-control" placeholder="127.5K">
      </div>
      <div class="form-group">
        <label>Điểm đánh giá TB (VD: 4.8)</label>
        <input type="text" id="prodRating" class="form-control" placeholder="4.8">
      </div>
    </div>

    <div class="form-group">
      <label>Ảnh sản phẩm</label>
      <input type="file" id="imageInput" multiple accept="image/*" style="display:none" onchange="handleImageUpload(event)">
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('imageInput').click()">+ Tải ảnh lên</button>
      <div class="media-grid" id="imageGrid"></div>
    </div>

    <div class="form-group" style="margin-top:20px; border-top:1px solid var(--border); padding-top:15px;">
      <label style="font-weight:bold; color:var(--primary); margin-bottom:10px;">⭐ Quản lý Đánh giá riêng cho sản phẩm này</label>
      <div id="productReviewsList" style="margin-bottom:10px;"></div>
      <div style="background:#1a1a1a; padding:12px; border-radius:6px; border:1px solid var(--border);">
        <div style="display:grid; grid-template-columns:2fr 1fr; gap:10px; margin-bottom:8px;">
          <input type="text" id="newRevName" class="form-control" placeholder="Tên khách hàng (VD: Nguyễn Văn A)">
          <select id="newRevRating" class="form-control">
            <option value="5">5 ★★★★★</option>
            <option value="4">4 ★★★★</option>
            <option value="3">3 ★★★</option>
            <option value="2">2 ★★</option>
            <option value="1">1 ★</option>
          </select>
        </div>
        <textarea id="newRevContent" class="form-control" rows="2" placeholder="Nội dung đánh giá của khách về sản phẩm này..."></textarea>
        <button class="btn btn-secondary btn-sm" style="margin-top:8px;" onclick="addProductReviewItem()">+ Thêm đánh giá này vào sản phẩm</button>
      </div>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
      <button class="btn btn-secondary" onclick="closeProductModal()">Hủy</button>
      <button class="btn btn-primary" onclick="saveProduct()">Lưu cấu hình</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCAM8aZvUM5KwzNttrnTNsqo30yhf2IbKI",
  authDomain: "hoangtruong-c6268.firebaseapp.com",
  databaseURL: "https://hoangtruong-c6268-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hoangtruong-c6268",
  storageBucket: "hoangtruong-c6268.firebasestorage.app",
  messagingSenderId: "858441479645",
  appId: "1:858441479645:web:bad1af63eadf0633a1f234"
};

if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const db = firebase.database();

let products = [];
let tempImages = [];
let tempProductReviews = []; // Lưu tạm đánh giá của sản phẩm đang sửa

function checkLogin() {
  if(document.getElementById('loginPass').value === '123456') {
    document.getElementById('loginModal').style.display = 'none';
    db.ref('hta_products').on('value', (snapshot) => {
      products = snapshot.val() || [];
      renderProducts();
    });
  } else { alert('Mật khẩu sai!'); }
}

function renderProducts() {
  const tbody = document.getElementById('productTableBody');
  const search = document.getElementById('searchProductInput').value.toLowerCase();
  tbody.innerHTML = '';

  products.filter(p => p.name.toLowerCase().includes(search)).forEach((p, idx) => {
    const imgUrl = (p.images && p.images.length > 0) ? p.images[0] : '';
    const revCount = (p.reviews && Array.isArray(p.reviews)) ? p.reviews.length : 0;
    tbody.innerHTML += `
      <tr>
        <td><img src="${imgUrl}" style="width:40px;height:40px;border-radius:4px;object-fit:cover"></td>
        <td><b>${p.name}</b></td>
        <td><b style="color:var(--primary)">${p.price}</b></td>
        <td>Đã bán: ${p.sold || '127.5K'} | ★ ${p.rating || '4.8'} <br><small style="color:var(--primary)">(${revCount} đánh giá riêng)</small></td>
        <td><button class="btn btn-secondary btn-sm" onclick="editProduct(${idx})">Sửa & Đánh giá</button></td>
      </tr>
    `;
  });
}

function handleImageUpload(e) {
  Array.from(e.target.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = (evt) => { tempImages.push(evt.target.result); renderMediaGrid(); };
    reader.readAsDataURL(file);
  });
}

function renderMediaGrid() {
  const grid = document.getElementById('imageGrid');
  grid.innerHTML = '';
  tempImages.forEach((img, i) => {
    grid.innerHTML += `<div class="media-box"><img src="${img}"><button class="remove-btn" onclick="tempImages.splice(${i},1);renderMediaGrid();">×</button></div>`;
  });
}

// Quản lý danh sách review tạm thời trong modal
function renderAdminProductReviews() {
  const container = document.getElementById('productReviewsList');
  if(tempProductReviews.length === 0) {
    container.innerHTML = '<div style="color:var(--text-muted);font-size:12px;font-style:italic;">Chưa có đánh giá riêng nào cho sản phẩm này.</div>';
    return;
  }
  let html = '';
  tempProductReviews.forEach((r, idx) => {
    html += `
      <div class="review-item-admin">
        <div>
          <b>${r.name}</b> <span style="color:#ffb400">★ ${r.rating}</span>
          <div style="font-size:12px;color:var(--text-muted);">${r.content}</div>
        </div>
        <button class="btn btn-secondary btn-sm" style="background:#d63031;color:#fff;" onclick="tempProductReviews.splice(${idx},1);renderAdminProductReviews();">Xóa</button>
      </div>
    `;
  });
  container.innerHTML = html;
}

function addProductReviewItem() {
  const name = document.getElementById('newRevName').value.trim();
  const rating = document.getElementById('newRevRating').value;
  const content = document.getElementById('newRevContent').value.trim();
  if(!name || !content) { alert('Vui lòng nhập tên khách và nội dung đánh giá!'); return; }

  tempProductReviews.push({ name, rating, content, time: new Date().toLocaleDateString('vi-VN') });
  document.getElementById('newRevName').value = '';
  document.getElementById('newRevContent').value = '';
  renderAdminProductReviews();
}

function openProductModal() {
  document.getElementById('prodEditId').value = '';
  document.getElementById('prodName').value = '';
  document.getElementById('prodPrice').value = '';
  document.getElementById('prodOldPrice').value = '';
  document.getElementById('prodSold').value = '127.5K';
  document.getElementById('prodRating').value = '4.8';
  tempImages = [];
  tempProductReviews = [];
  renderMediaGrid();
  renderAdminProductReviews();
  document.getElementById('productModal').style.display = 'flex';
}

function closeProductModal() { document.getElementById('productModal').style.display = 'none'; }

function editProduct(idx) {
  const p = products[idx];
  document.getElementById('prodEditId').value = idx;
  document.getElementById('prodName').value = p.name;
  document.getElementById('prodPrice').value = p.price;
  document.getElementById('prodOldPrice').value = p.old || '';
  document.getElementById('prodSold').value = p.sold || '127.5K';
  document.getElementById('prodRating').value = p.rating || '4.8';
  tempImages = p.images ? [...p.images] : [];
  tempProductReviews = p.reviews ? [...p.reviews] : [];
  renderMediaGrid();
  renderAdminProductReviews();
  document.getElementById('productModal').style.display = 'flex';
}

function saveProduct() {
  const editIdx = document.getElementById('prodEditId').value;
  const name = document.getElementById('prodName').value.trim();
  const price = document.getElementById('prodPrice').value.trim();
  if(!name || !price) { alert('Vui lòng nhập tên và giá sản phẩm!'); return; }

  const pData = {
    id: editIdx !== '' ? products[editIdx].id : 'p_' + Date.now(),
    name: name,
    price: price,
    old: document.getElementById('prodOldPrice').value.trim(),
    sold: document.getElementById('prodSold').value.trim() || '127.5K',
    rating: document.getElementById('prodRating').value.trim() || '4.8',
    images: tempImages,
    reviews: tempProductReviews, // Lưu mảng đánh giá riêng của sản phẩm
    status: true
  };

  if(editIdx !== '') products[editIdx] = pData;
  else products.push(pData);

  db.ref('hta_products').set(products).then(() => {
    alert("Đã lưu sản phẩm và đánh giá riêng thành công!");
    closeProductModal();
  });
}
</script>
</body>
</html>
