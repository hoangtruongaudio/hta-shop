<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HOÀNG TRƯỜNG AUDIO</title>
<style>
:root{ --pink:#fe2c55;--dark:#042e3c;--text:#161823;--muted:#777;--line:#ececec; }
*{box-sizing:border-box} html,body{margin:0;background:#f5f5f5;color:var(--text);font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{max-width:720px;margin:auto;padding-bottom:72px;position:relative}

/* Clearance for Phone Status Bar */
.status{height:24px;background:var(--dark)}

.nav{height:56px;background:var(--dark);color:#fff;display:flex;align-items:center;padding:0 15px;gap:15px;position:sticky;top:0;z-index:100}
.nav .back{font-size:26px;background:none;border:0;color:#fff;cursor:pointer}
.nav .search{flex:1;background:#ffffff22;border-radius:20px;height:36px;display:flex;align-items:center;padding:0 12px;font-size:13px;color:#eee}

.list{background:#fff}
.product{display:flex;gap:12px;padding:12px;border-bottom:1px solid #eee;cursor:pointer}
.pimg{width:110px;height:110px;background:#eee;border-radius:6px;overflow:hidden;flex:none}
.pimg img, .pimg video{width:100%;height:100%;object-fit:cover}
.pbody{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.pname{font-size:15px;line-height:1.3;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-size:18px;color:var(--pink);font-weight:800}

/* Detail Page & Carousel Slider */
.detail{display:none;background:#fff;min-height:100vh}
.detail.show{display:block}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;aspect-ratio:1;background:#000}
.carousel-item{flex:0 0 100%;scroll-snap-align:start;position:relative}
.carousel-item img, .carousel-item video{width:100%;height:100%;object-fit:cover}

.dinfo{padding:15px}
.dprice{font-size:24px;color:var(--pink);font-weight:800}
.variants{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.variant-btn{padding:8px 14px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:13px}
.variant-btn.active{border-color:var(--pink);color:var(--pink);background:#fff0f3}

.sticky{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);background:#fff;border-top:1px solid #ddd;padding:8px;display:flex;gap:8px;z-index:90}
.sticky .buy{flex:1;background:var(--pink);color:#fff;border:0;border-radius:6px;font-weight:bold;padding:12px}

/* Modal Checkout */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:none;align-items:flex-end}
.sheet{width:min(720px,100%);margin:auto;background:#fff;border-radius:12px 12px 0 0;padding:18px}
.sheet input, .sheet textarea{width:100%;padding:10px;margin-top:8px;border:1px solid #ddd;border-radius:6px;outline:none}
.sheet .btn-confirm{width:100%;padding:12px;background:var(--pink);color:#fff;border:none;border-radius:6px;font-weight:bold;margin-top:12px;cursor:pointer}
</style>
</head>
<body>

<div class="status"></div>
<div class="nav">
  <button class="back" onclick="backHome()">‹</button>
  <div class="search">⌕&nbsp; Tìm kiếm trên shop...</div>
</div>

<!-- Home Page -->
<div id="home">
  <div style="padding:15px; background:linear-gradient(135deg, #fe2c55, #ff758c); color:#fff; border-radius:0 0 12px 12px;">
    <h2>HOÀNG TRƯỜNG AUDIO</h2>
    <p style="font-size:13px;">Chuyên phụ kiện âm thanh cao cấp</p>
  </div>
  <div class="list" id="productList"></div>
</div>

<!-- Detail Page -->
<div id="detail" class="detail">
  <div class="carousel" id="detailCarousel"></div>
  <div class="dinfo">
    <div class="dprice" id="detailPrice"></div>
    <h2 id="detailTitle" style="font-size:18px; margin-top:5px;"></h2>
    
    <div style="margin-top:15px;">
      <label style="font-size:13px; font-weight:bold;">Chọn phân loại:</label>
      <div class="variants" id="detailVariants"></div>
    </div>

    <div style="margin-top:20px; border-top:1px solid #eee; padding-top:15px;">
      <h3 style="font-size:15px;">Mô tả sản phẩm</h3>
      <div id="detailDesc" style="font-size:14px; color:#444; line-height:1.6; margin-top:8px;"></div>
    </div>
  </div>
</div>

<div class="sticky" id="stickyNav" style="display:none;">
  <button class="buy" onclick="openCheckout()">MUA NGAY KHUYẾN MÃI</button>
</div>

<!-- Modal Đặt Hàng -->
<div class="sheetbg" id="sheetbg">
  <div class="sheet">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3>Xác nhận đơn hàng</h3>
      <button onclick="closeCheckout()" style="border:none; background:none; font-size:20px;">×</button>
    </div>
    <p id="orderSummary" style="font-size:13px; color:var(--pink); font-weight:bold; margin-top:8px;"></p>
    
    <input type="text" id="custName" placeholder="Họ và tên người nhận *">
    <input type="tel" id="custPhone" placeholder="Số điện thoại *">
    <textarea id="custAddr" rows="3" placeholder="Địa chỉ chi tiết (Số nhà, đường, phường/xã) *"></textarea>
    
    <button class="btn-confirm" onclick="submitOrder()">HOÀN TẤT ĐẶT HÀNG</button>
  </div>
</div>

<script>
let currentProd = null;
let selectedVariant = '';

// Tải danh sách sản phẩm trực tiếp từ Admin (LocalStorage)
function getProducts() {
  const data = localStorage.getItem('hta_products');
  return data ? JSON.parse(data) : [];
}

function renderHomeProducts() {
  const list = document.getElementById('productList');
  if (!list) return;
  list.innerHTML = '';
  
  const products = getProducts();
  const activeProducts = products.filter(p => p.status);

  if (activeProducts.length === 0) {
    list.innerHTML = '<div style="text-align:center; padding:40px; color:#888;">Chưa có sản phẩm nào hiển thị.</div>';
    return;
  }

  activeProducts.forEach(p => {
    const coverMedia = (p.images && p.images.length > 0) 
      ? `<img src="${p.images[0]}">` 
      : (p.video ? `<video src="${p.video}"></video>` : '<div style="background:#eee;width:100%;height:100%"></div>');
    
    const div = document.createElement('div');
    div.className = 'product';
    div.onclick = () => openDetail(p.id);
    div.innerHTML = `
      <div class="pimg">${coverMedia}</div>
      <div class="pbody">
        <div class="pname">${p.name}</div>
        <div class="price">${p.price}</div>
      </div>
    `;
    list.appendChild(div);
  });
}

function openDetail(id) {
  const products = getProducts();
  currentProd = products.find(p => p.id === id);
  if (!currentProd) return;

  document.getElementById('home').style.display = 'none';
  document.getElementById('detail').classList.add('show');
  document.getElementById('stickyNav').style.display = 'flex';

  document.getElementById('detailTitle').textContent = currentProd.name;
  document.getElementById('detailPrice').textContent = currentProd.price;
  document.getElementById('detailDesc').innerHTML = currentProd.desc || 'Chưa có mô tả.';

  // Render Carousel (Video + Ảnh)
  const carousel = document.getElementById('detailCarousel');
  carousel.innerHTML = '';
  if (currentProd.video) {
    carousel.innerHTML += `<div class="carousel-item"><video src="${currentProd.video}" controls autoplay loop muted></video></div>`;
  }
  (currentProd.images || []).forEach(img => {
    carousel.innerHTML += `<div class="carousel-item"><img src="${img}"></div>`;
  });

  // Render Biến thể
  const vContainer = document.getElementById('detailVariants');
  vContainer.innerHTML = '';
  selectedVariant = (currentProd.variants && currentProd.variants.length > 0) ? currentProd.variants[0] : '';
  (currentProd.variants || []).forEach((v, idx) => {
    const btn = document.createElement('button');
    btn.className = `variant-btn ${idx === 0 ? 'active' : ''}`;
    btn.textContent = v;
    btn.onclick = () => {
      document.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedVariant = v;
    };
    vContainer.appendChild(btn);
  });
}

function backHome() {
  document.getElementById('detail').classList.remove('show');
  document.getElementById('home').style.display = 'block';
  document.getElementById('stickyNav').style.display = 'none';
  renderHomeProducts(); // Tải lại danh sách mới nhất khi quay về trang chủ
}

function openCheckout() {
  if (!currentProd) return;
  document.getElementById('orderSummary').textContent = `${currentProd.name} (${selectedVariant || 'Mặc định'}) - ${currentProd.price}`;
  document.getElementById('sheetbg').style.display = 'flex';
}

function closeCheckout() {
  document.getElementById('sheetbg').style.display = 'none';
}

function submitOrder() {
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const addr = document.getElementById('custAddr').value.trim();

  if (!name || !phone || !addr) {
    alert('Vui lòng điền đầy đủ thông tin giao hàng!');
    return;
  }

  const orders = JSON.parse(localStorage.getItem('hta_orders')) || [];
  orders.unshift({
    id: 'ORD_' + Date.now(),
    name: name,
    phone: phone,
    address: addr,
    prodName: currentProd.name,
    variant: selectedVariant,
    price: currentProd.price,
    status: 'Mới',
    time: new Date().toLocaleString('vi-VN')
  });

  localStorage.setItem('hta_orders', JSON.stringify(orders));
  alert('Đặt hàng thành công! Shop sẽ liên hệ xác nhận sớm nhất.');
  closeCheckout();
  backHome();
}

// Tự động lắng nghe khi có thay đổi từ tab Admin
window.addEventListener('storage', (e) => {
  if (e.key === 'hta_products') {
    renderHomeProducts();
  }
});

// Chạy khởi tạo
renderHomeProducts();
</script>
</body>
</html>
